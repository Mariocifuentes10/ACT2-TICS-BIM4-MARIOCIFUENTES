<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea de JavaScript</title>
    <!-- Estilos opcionales para una mejor estética con el estilo preferido -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
            text-align: center;
            border: 1px solid #d4af37;
        }
        h1 {
            color: #d4af37;
        }
        button {
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #f3e5ab;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Elementos visibles requeridos (Título, Párrafo y Botón) -->
        <h1 id="titulo">¡Bienvenido a mi tarea!</h1>
        <p id="parrafo">Este es un párrafo de ejemplo que cambiará al hacer clic en el botón.</p>
        <button id="miBoton">Hacer Clic</button>
    </div>

    <!-- Vinculación del archivo script.js externo (Paso 2) -->
    <script src="script.js"></script>
</body>
</html>
